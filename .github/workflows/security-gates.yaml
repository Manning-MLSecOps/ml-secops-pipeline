# Trigger re-run after security tool fail-closed update again
name: Security Gates

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  config-policy-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install security tools (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/Manning-MLSecOps/ml-secops-security-tools.git@main"

      - name: Validate config (fail closed if missing)
        run: |
          set -euo pipefail

          echo "Starting pipeline security configuration validation..."
          echo "PWD=$(pwd)"

          echo "=== Repo root ==="
          ls -la

          echo "=== configs dir ==="
          ls -la configs || true

          test -f configs/pipeline_config.json
          echo " Found configs/pipeline_config.json"

          python -m secure_config_checker.cli --config configs/pipeline_config.json
          echo " SECURITY POLICY PASSED"
