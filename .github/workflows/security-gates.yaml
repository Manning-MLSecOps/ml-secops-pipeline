# Trigger re-run after security tool fail-closed update
name: Security Gates

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  config-policy-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install security tools (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/Manning-MLSecOps/ml-secops-security-tools.git@main"

      - name: Validate config
        run: |
          echo "Starting pipeline security configuration validation..."

          if python -m secure_config_checker.cli --config configs/pipeline_config.json; then
            echo "SECURITY POLICY PASSED: Pipeline configuration is compliant."
          else
            echo "SECURITY POLICY FAILED: Pipeline configuration is NOT compliant!"
            exit 1
          fi
