# Trigger re-run after security tool fail-closed update again
name: Security Gates

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  config-policy-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install security tools (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/Manning-MLSecOps/ml-secops-security-tools.git@62c62dba5a56504e11770cb70189833b6de6f7ff"

      - name: Validate config (fail closed if missing)
        run: |
          set -euo pipefail

          echo "Starting pipeline security configuration validation..."

          echo "Checking if required config file exists..."
          test -f configs/pipeline_config.json

          echo "Config file found showing contents"
          cat configs/pipeline_config.json

          echo "Running security configuration validation..."
          if secure-config-checker --config configs/pipeline_config.json; then
            echo "Security configuration validation passed."
          else
            echo "Security configuration validation failed."
            exit 1
          fi
